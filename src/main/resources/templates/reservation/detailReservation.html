<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예매 상세</title>
    <link rel="stylesheet" href="/css/detailReservation.css" />
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <a href="/reservation" class="back-btn">← 예매 목록으로</a>
    </div>

    <div id="content">
        <div class="loading-box">예매 상세 정보를 불러오는 중입니다...</div>
    </div>
</div>

<div class="modal-backdrop" id="cancelModal">
    <div class="modal">
        <div class="modal-title">예매 취소</div>

        <div class="policy-box">
            <div class="policy-title">취소 정책 안내</div>
            <div class="policy-text">
                - 공연 7일 전까지: 전액 환불<br>
                - 공연 3일 전까지: 70% 환불<br>
                - 공연 1일 전까지: 50% 환불<br>
                - 공연 당일 이후: 취소 불가
            </div>
        </div>

        <div class="policy-box">
            <div class="policy-title">환불 정보</div>
            <div class="policy-text" id="refundInfoText">
                환불 정보를 불러오는 중입니다...
            </div>
        </div>

        <div class="modal-question" id="cancelQuestion">예매를 취소하시겠습니까?</div>

        <div class="modal-actions" id="cancelActionButtons">
            <button class="modal-btn no" onclick="closeCancelModal()">아니오</button>
            <button class="modal-btn yes" disabled>예</button>
        </div>
    </div>
</div>
<script src="/js/detailReservation.js"></script>
</body>
</html>
