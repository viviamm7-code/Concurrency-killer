<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예매한 공연 조회</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: #f8fafc;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .top-box {
      margin-bottom: 32px;
    }

    .sub-title {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .main-title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .desc {
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .count-box {
      font-size: 18px;
      font-weight: 700;
    }

    .count-box span {
      color: #f472b6;
    }

    .reload-btn {
      border: none;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 320px);
      gap: 24px;
      justify-content: start;
    }

    .card {
      width: 320px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .poster {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #1e293b;
    }

    .card-body {
      padding: 22px;
    }

    .badge {
      display: inline-block;
      background: rgba(244, 114, 182, 0.15);
      color: #f9a8d4;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 18px;
      line-height: 1.35;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .label {
      color: #94a3b8;
      font-size: 14px;
      min-width: 72px;
    }

    .value {
      text-align: right;
      color: #f8fafc;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      flex: 1;
    }

    .seat-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .seat-title {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .seat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .seat-item {
      padding: 8px 10px;
      border-radius: 10px;
      background: #334155;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .message-box {
      padding: 40px 20px;
      text-align: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 16px;
    }

    .status-section {
      margin-bottom: 40px;
    }

    .status-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 18px;
      color: #f8fafc;
    }

    @media (max-width: 768px) {
      .main-title {
        font-size: 30px;
      }

      .info-row {
        flex-direction: column;
      }

      .value {
        text-align: left;
      }
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .filter-wrap {
      position: relative;
    }

    .filter-btn {
      border: none;
      padding: 14px 22px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .filter-menu {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 160px;
      padding: 8px;
      border-radius: 16px;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 16px 30px rgba(0,0,0,0.28);
      display: none;
      z-index: 100;
    }

    .filter-wrap:hover .filter-menu {
      display: block;
    }

    .filter-item {
      width: 100%;
      border: none;
      background: transparent;
      color: #f8fafc;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-item:hover {
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-box">
    <div class="sub-title">MY TICKETS</div>
    <div class="main-title">예매한 공연 조회</div>
    <div class="desc">내가 예매한 공연 정보와 좌석을 한눈에 확인해보세요.</div>
  </div>

  <div class="toolbar">
    <div class="count-box">총 <span id="count">0</span>건의 예매 내역</div>
    <div class="action-bar">
      <div class="filter-wrap">
        <button type="button" class="filter-btn" id="currentFilterLabel">전체 ▾</button>

        <div class="filter-menu">
          <button type="button" class="filter-item" onclick="changeFilter('ALL', '전체')">전체</button>
          <button type="button" class="filter-item" onclick="changeFilter('RESERVED', '예매 중')">예매 중</button>
          <button type="button" class="filter-item" onclick="changeFilter('CANCELED', '취소')">취소</button>
          <button type="button" class="filter-item" onclick="changeFilter('COMPLETED', '관람 완료')">관람 완료</button>
        </div>
      </div>
      <button class="reload-btn" onclick="loadReservations()">새로고침</button>
    </div>
  </div>

  <div id="content">
    <div class="message-box">예매 내역을 불러오는 중입니다...</div>
  </div>
</div>

<script>

  const defaultImage = "https://images.unsplash.com/photo-1503095396549-807759245b35?auto=format&fit=crop&w=1200&q=80";
  let reservations = [];
  let currentFilter = "ALL";

  function formatDateTime(dateTimeStr) {
    if (!dateTimeStr) return "-";

    const date = new Date(dateTimeStr);
    if (isNaN(date)) return dateTimeStr;

    return date.toLocaleString("ko-KR", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function getDisplayStatus(item) {
    if (item.reservationStatus === "CANCELED") {
      return "CANCELED";
    }

    const startedAt = new Date(item.startedAt);
    const now = new Date();

    if (!isNaN(startedAt) && startedAt < now) {
      return "COMPLETED";
    }

    return "RESERVED";
  }

  function formatStatus(status) {
    const statusMap = {
      RESERVED: "예매 중",
      CANCELED: "취소",
      COMPLETED: "관람 완료"
    };

    return statusMap[status] || status || "-";
  }

  function createCard(item) {
    const seats = item.seatNumbers || [];
    const imageUrl = item.imageUrl || "https://images.unsplash.com/photo-1503095396549-807759245b35?auto=format&fit=crop&w=1200&q=80";

    return `
      <div class="card" onclick="goToDetail(${item.reservationId})" style="cursor:pointer;">
        <img class="poster" src="${imageUrl}" alt="${item.performanceName}" />
        <div class="card-body">
          <div class="badge">${formatStatus(getDisplayStatus(item))}</div>
          <div class="title">${item.performanceName ?? "-"}</div>

          <div class="info-list">
            <div class="info-row">
              <div class="label">공연장</div>
              <div class="value">${item.venue ?? "-"}</div>
            </div>
            <div class="info-row">
              <div class="label">공연일</div>
              <div class="value">${formatDateTime(item.startedAt)}</div>
            </div>
            <div class="info-row">
              <div class="label">예매일</div>
              <div class="value">${formatDateTime(item.reservedAt)}</div>
            </div>
          </div>

          <div class="seat-box">
            <div class="seat-title">예매 좌석</div>
            <div class="seat-list">
              ${
            seats.length > 0
                    ? seats.map(seat => `<span class="seat-item">${seat}</span>`).join("")
                    : `<span class="seat-item">좌석 정보 없음</span>`
    }
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderSection(title, items) {
    return `
    <div class="status-section">
      <div class="status-title">${title}</div>
      ${
            items && items.length > 0
                    ? `
            <div class="card-grid">
              ${items.map(item => createCard(item)).join("")}
            </div>
          `
                    : `
            <div class="message-box">해당 상태의 예매 내역이 없습니다.</div>
          `
    }
    </div>
  `;
  }

  function goToDetail(reservationId) {
    location.href = `/reservation/${reservationId}`;
  }

  async function loadReservations() {
    const content = document.getElementById("content");

    content.innerHTML = `<div class="message-box">예매 내역을 불러오는 중입니다...</div>`;

    try {
      const response = await fetch("/api/reservation");
      const data = await response.json();

      reservations = data || [];
      renderReservations();
    } catch (error) {
      console.error(error);
      content.innerHTML = `<div class="message-box">예매 내역을 불러오지 못했습니다.</div>`;
      document.getElementById("count").textContent = 0;
    }
  }

  function getStatusPriority(item) {
    const status = getDisplayStatus(item);

    if (status === "RESERVED") return 0;
    if (status === "CANCELED") return 1;
    return 2; // COMPLETED
  }

  function changeFilter(filter, label) {
    currentFilter = filter;
    document.getElementById("currentFilterLabel").textContent = `${label} ▾`;
    renderReservations();
  }

  function renderReservations() {
    const content = document.getElementById("content");
    const count = document.getElementById("count");

    if (!reservations || reservations.length === 0) {
      count.textContent = 0;
      content.innerHTML = `<div class="message-box">예매한 공연이 없습니다.</div>`;
      return;
    }

    if (currentFilter === "ALL") {
      const reservedItems = reservations.filter(item => getDisplayStatus(item) === "RESERVED");
      const canceledItems = reservations.filter(item => getDisplayStatus(item) === "CANCELED");
      const completedItems = reservations.filter(item => getDisplayStatus(item) === "COMPLETED");

      count.textContent = reservations.length;

      content.innerHTML = `
      ${renderSection("예매 중", reservedItems)}
      ${renderSection("취소", canceledItems)}
      ${renderSection("관람 완료", completedItems)}
    `;

      return;
    }

    const filteredData = reservations.filter(item => getDisplayStatus(item) === currentFilter);

    count.textContent = filteredData.length;

    if (!filteredData.length) {
      content.innerHTML = `<div class="message-box">해당 조건의 예매 내역이 없습니다.</div>`;
      return;
    }

    content.innerHTML = renderSection(formatStatus(currentFilter), filteredData);
  }

  loadReservations();

  window.addEventListener("pageshow", function () {
    const updateRaw = sessionStorage.getItem("reservationUpdate");
    if (!updateRaw) return;

    // 목록 데이터가 살아있을 때만 로컬 반영
    if (!reservations || reservations.length === 0) {
      sessionStorage.removeItem("reservationUpdate");
      return;
    }

    const update = JSON.parse(updateRaw);

    reservations = reservations.map(item =>
            item.reservationId === update.reservationId
                    ? {
                      ...item,
                      reservationStatus: update.reservationStatus
                    }
                    : item
    );

    sessionStorage.removeItem("reservationUpdate");
    renderReservations();
  });
</script>
</body>
</html>
