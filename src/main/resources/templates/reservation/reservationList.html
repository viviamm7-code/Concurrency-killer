<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 예매</title>
  <link rel="stylesheet" href="/css/reservationList.css" />
  <div id="loginButton">
    <script src="/js/common.js" defer></script>
  </div>
</head>
<body>
<div class="wrap">
  <div class="top-box">
    <div class="sub-title">MY TICKETS</div>
    <div class="main-title">내 예매</div>
    <div class="desc">내가 예매한 공연 정보와 좌석을 한눈에 확인해보세요.</div>
  </div>

  <div class="toolbar">
    <div class="count-box">총 <span id="count">0</span>건의 예매 내역</div>
    <div class="action-bar">
      <div class="filter-wrap">
        <button type="button" class="filter-btn" id="currentFilterLabel">전체 ▾</button>

        <div class="filter-menu">
          <button type="button" class="filter-item" onclick="changeFilter('ALL', '전체')">전체</button>
          <button type="button" class="filter-item" onclick="changeFilter('RESERVED', '예매 중')">예매 완료</button>
          <button type="button" class="filter-item" onclick="changeFilter('CANCELED', '취소')">취소</button>
          <button type="button" class="filter-item" onclick="changeFilter('COMPLETED', '관람 완료')">관람 완료</button>
        </div>
      </div>
      <button class="reload-btn" onclick="loadReservations()">새로고침</button>
    </div>
  </div>

  <div id="content">
    <div class="message-box">예매 내역을 불러오는 중입니다...</div>
  </div>
</div>
<script src="/js/reservationList.js"></script>
</body>
</html>
