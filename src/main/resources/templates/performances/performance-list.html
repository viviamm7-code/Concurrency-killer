<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>뮤지컬 공연</title>
    <link rel="stylesheet" type="text/css" href="/css/header.css">
    <script src="/js/common.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 0px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wrap {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0px 20px 80px;
        }

        .top-box {
            margin-bottom: 32px;
        }

        .sub-title {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .main-title {
            font-size: 40px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .desc {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.6;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .count-box {
            font-size: 18px;
            font-weight: 700;
        }

        .count-box span {
            color: #f472b6;
        }

        .reload-btn {
            border: none;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            padding: 12px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        @media (max-width: 1200px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #1e293b;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 18px;
            line-height: 1.35;
        }

        .message-box {
            padding: 40px 20px;
            text-align: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 30px;
            }
        }

        .poster-wrap {
            position: relative;
            height: 380px;
            overflow: hidden;
        }

        .poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 🔥 어두운 투명 레이어 */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.7),
                    rgba(0, 0, 0, 0.2),
                    transparent
            );
        }

        /* 🔥 텍스트를 이미지 위로 */
        .poster-text {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 20px;
            color: white;
        }

        .poster-text .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .poster-text .sub {
            font-size: 16px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
<header>
    <div></div>  <!-- 왼쪽 빈 공간 (뒤로가기 버튼 없으므로) -->
    <div id="loginButton"></div>
</header>
<div class="wrap">
    <div class="top-box">
        <div class="sub-title">MY TICKETS</div>
        <div class="main-title">뮤지컬 공연</div>
        <div class="desc">설레는 순간이 시작될 뮤지컬 공연을 만나보세요.</div>
    </div>

    <div class="toolbar">
        <div class="count-box">총 <span id="count">0</span>건의 공연</div>
        <button class="reload-btn" onclick="loadReservations()">새로고침</button>
    </div>

    <div id="content">
        <div class="message-box">예매 내역을 불러오는 중입니다...</div>
    </div>
</div>

<script>
    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return "-";

        const date = new Date(dateTimeStr);
        if (isNaN(date)) return dateTimeStr;

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}.${month}.${day}`;
    }

    function createCard(performance) {
        const imageUrl = performance.imageUrl || "";

        return `
  <div class="card" onclick="goToDetail(${performance.id})" style="cursor:pointer;">

    <div class="poster-wrap">
      <img class="poster" src="${imageUrl}" alt="${performance.performanceName}" />

      <div class="overlay"></div>

      <div class="poster-text">
        <div class="title">${performance.performanceName ?? "-"}</div>
        <div class="sub">
          ${performance.venue ?? "-"}<br/>
          ${formatDateTime(performance.startDate)} ~ ${formatDateTime(performance.endDate)}
        </div>
      </div>
    </div>

  </div>
`;
    }

    function goToDetail(performanceId) {
        location.href = `/performances/${performanceId}`;
    }

    async function loadReservations() {
        const content = document.getElementById("content");
        const count = document.getElementById("count");

        content.innerHTML = `<div class="message-box">공연을 불러오는 중입니다...</div>`;

        try {
            const response = await fetch("/api/performances");
            const data = await response.json();

            count.textContent = data.length;

            if (!data || data.length === 0) {
                content.innerHTML = `<div class="message-box">공연이 없습니다.</div>`;
                return;
            }

            content.innerHTML = `
          <div class="card-grid">
            ${data.map(item => createCard(item)).join("")}
          </div>
        `;
        } catch (error) {
            console.error(error);
            content.innerHTML = `<div class="message-box">공연을 불러오지 못했습니다.</div>`;
        }
    }

    loadReservations();
</script>
</body>
</html>
