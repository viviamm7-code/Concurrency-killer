<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원 관리</title>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
<header>
  <a href="/admin" class="btn-back">←</a>
</header>

<main class="wrap">
  <section class="top-box">
    <p class="sub-title">ADMIN MEMBER MANAGEMENT</p>
    <h1 class="main-title">회원 관리</h1>
    <p class="desc">
      회원 목록을 조회하고 아이디로 검색할 수 있습니다.<br>
      회원을 클릭하면 바로 아래에서 상세 정보를 확인할 수 있습니다.
    </p>
  </section>

  <section class="page-actions">
    <div class="page-search-wrap">
      <input
              type="text"
              id="memberSearchInput"
              class="page-search-input"
              placeholder="아이디 검색"
      />
    </div>

    <div class="count-box">
      총 <span id="memberCount">0</span>명
    </div>
  </section>

  <section class="page-table-wrap">
    <table class="page-table">
      <thead>
      <tr>
        <th style="width: 100px; text-align: right; padding-right: 28px;">회원번호</th>
        <th style="text-align: center;">아이디</th>
      </tr>
      </thead>
      <tbody id="memberTableBody"></tbody>
    </table>
  </section>

  <div id="memberEmptyBox" class="message-box small hidden">
    조회된 회원이 없습니다.
  </div>

  <div id="memberErrorBox" class="message-box small hidden">
    회원 정보를 불러오는 중 오류가 발생했습니다.
  </div>
</main>

<script src="/js/admin-members.js"></script>
</body>
</html>
