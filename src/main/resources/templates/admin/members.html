<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원 관리</title>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
<header>
  <a href="/admin" class="btn-back">←</a>

  <div class="header-right">
    <span id="adminName">관리자 확인 중...</span>
    <span class="admin-chip">ADMIN</span>
  </div>
</header>

<div class="wrap">
  <section class="top-box">
    <p class="sub-title">MEMBER MANAGEMENT</p>
    <h1 class="main-title">회원 관리</h1>
    <p class="desc">가입한 회원 정보를 확인하고 권한을 조회합니다.</p>
  </section>

  <section id="forbiddenBox" class="message-box hidden">
    관리자만 접근할 수 있습니다.
  </section>

  <section id="pageSection" class="hidden">
    <div class="page-actions">
      <div class="count-box">총 회원 수 <span id="memberCount">0</span>명</div>

      <div class="page-search-wrap">
        <input type="text" id="searchInput" class="page-search-input" placeholder="아이디 검색" />
        <button id="reloadBtn" class="page-btn">새로고침</button>
      </div>
    </div>

    <div class="page-table-wrap">
      <table class="page-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>로그인 아이디</th>
          <th>권한</th>
        </tr>
        </thead>
        <tbody id="memberTableBody"></tbody>
      </table>
    </div>

    <div id="emptyBox" class="message-box small hidden">회원 데이터가 없습니다.</div>
  </section>
</div>

<script src="/js/admin-members.js"></script>
</body>
</html>
