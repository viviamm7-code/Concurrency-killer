<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제 관리</title>
    <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
<header>
    <a href="/admin" class="btn-back">←</a>

    <div class="header-right">
        <span id="adminName">관리자 확인 중...</span>
        <span class="admin-chip">ADMIN</span>
    </div>
</header>

<div class="wrap">
    <section class="top-box">
        <p class="sub-title">PAYMENT MANAGEMENT</p>
        <h1 class="main-title">결제 관리</h1>
        <p class="desc">결제 내역과 결제 금액을 확인합니다.</p>
    </section>

    <section id="forbiddenBox" class="message-box hidden">
        관리자만 접근할 수 있습니다.
    </section>

    <section id="pageSection" class="hidden">
        <div class="page-actions">
            <div class="count-box">총 결제 수 <span id="paymentCount">0</span>건</div>

            <div class="page-search-wrap">
                <input type="text" id="searchInput" class="page-search-input" placeholder="주문번호 검색" />
                <button id="reloadBtn" class="page-btn">새로고침</button>
            </div>
        </div>

        <div class="page-table-wrap">
            <table class="page-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>예매 ID</th>
                    <th>주문번호</th>
                    <th>결제 키</th>
                    <th>금액</th>
                </tr>
                </thead>
                <tbody id="paymentTableBody"></tbody>
            </table>
        </div>

        <div id="emptyBox" class="message-box small hidden">결제 데이터가 없습니다.</div>
    </section>
</div>

<script src="/js/admin-payments.js"></script>
</body>
</html>
