<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script type="text/javascript">
    window.onload = function () {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === 'true') {
        alert('아이디 또는 비밀번호가 올바르지 않습니다.');
      }
      document.getElementById('lbtn').onclick = function () {
        if(document.lfrm.username.value.trim() == '') {
          alert('아이디를 입력해주세요')
          return false;
        }
        if(document.lfrm.password.value.trim() == '') {
          alert('비밀번호를 입력해주세요')
          return false;
        }

        document.lfrm.submit();
      }
    }
  </script>
  <link rel="stylesheet" type="text/css" href="/css/header.css">
  <style type="text/css">
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #121726;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    div.loginBox {
      width: 800px;
      height: 500px;
      background: #252938;
      border-radius: 30px;
      position: relative;
    }

    h1 {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      color: white;
      font-weight: bold;
    }

    form {
      position: absolute;
      top: 170px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
    }

    input {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: none;
      padding: 0 12px;
    }

    button {
      width: 100%;
      height: 40px;
      margin-top: 40px;
      background: linear-gradient(to right, #DD534B, #E87836);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 10px;
    }

    button:hover {
      border: solid 1px #1a1d20;
      cursor: pointer;
    }

    #nologin {
      position: absolute;
      right: 30px;
      bottom: 25px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="loginBox">
  <h1>포도알 사수 작전</h1>

  <form action="./members/login" method="post" name="lfrm">
    <input type="text" id="username" name="username" placeholder="username"/> <br/><br/>
    <input type="password" id="password" name="password" placeholder="PW"/> <br/>
    <button id="lbtn">로그인</button>
  </form>

  <a id="nologin" href="/performance-list">비 로그인으로 접속하기</a>
</div>
</body>
</html>
