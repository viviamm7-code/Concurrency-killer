<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>join</title>
    <style type="text/css">
        body {
            margin: 0;
            min-height: 100vh;
            background: #121726;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: white;
        }
    </style>
</head>
<script type="text/javascript">
    window.onload = () => {
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault(); // 기본 submit 막기

            const data = {
                username: this.username.value,
                name: this.name.value,
                password: this.password.value,
                email: this.email.value
            };

            fetch('/api/member/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(async res => {
                if(res.ok) {
                    alert("회원가입 완료");
                    window.location.href = "/login";
                } else {
                    const errorText = await res.text();
                    alert("가입 실패 : " + "입력 형식을 확인해 주세요.");
                    console.error("서버 응답 에러 :", errorText);
                }
            });
        });
    }
</script>
<body>

<form action="/api/member/join" method="post">
    아이디 : <input type="text" name="username" placeholder="USERNAME"/> <br/>
    이름 : <input type="text" name="name" placeholder="NAME"/> <br/>
    비밀번호 : <input type="password" name="password" placeholder="PASSWORD"/> <br/>
    이메일 : <input type="email" name="email" placeholder="EMAIL"/> <br/>
    <button type="submit">회원가입 완료</button>
</form>

</body>
</html>
