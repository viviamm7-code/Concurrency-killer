<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제 완료</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                    radial-gradient(circle at top left, rgba(236, 72, 153, 0.18), transparent 30%),
                    radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 28%),
                    linear-gradient(180deg, #0b1020 0%, #111827 100%);
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .icon {
            font-size: 56px;
            margin-bottom: 18px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .desc {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            min-width: 180px;
        }

        .btn:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🍇 감사합니다 🍇</div>
    <div class="title">🍷 결제가 완료되었습니다 🍷</div>
    <div class="desc">
        예매가 정상적으로 완료되었습니다.<br>
        아래 버튼을 눌러 내 예매 페이지로 이동하세요.
    </div>

    <a class="btn" th:href="${reservationUrl}">
        내 예매로 가기
    </a>
</div>
</body>
</html>
