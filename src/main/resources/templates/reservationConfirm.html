<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예매 확인</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f2f2f2; }
        .page { max-width: 920px; margin: 32px auto; background: #fff; padding: 32px; border-radius: 16px; }
        .title { font-size: 28px; margin-bottom: 20px; }
        .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; background: #fafafa; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #ececec; }
        .row:last-child { border-bottom: none; }
        .label { color: #666; }
        .value { font-weight: 700; text-align: right; }
        .trace { margin-top: 24px; background: #111; color: #aef5c6; padding: 16px; min-height: 180px; white-space: pre-wrap; font-size: 13px; border-radius: 12px; }
        button { width: 100%; height: 56px; border: none; border-radius: 10px; background: #1f8b4c; color: #fff; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
<div class="page">
    <div class="title">예매 확인 페이지</div>
    <div id="reservationInfo" class="card">예매 정보를 불러오는 중...</div>
    <button id="confirmBtn">최종 예매 확정</button>
    <div id="traceLog" class="trace"></div>
</div>

<script>
    const draftId = new URLSearchParams(window.location.search).get('draftId');
    let draft = null;

    function trace(message, data) {
        const traceLog = document.getElementById('traceLog');
        const suffix = data ? `\n${JSON.stringify(data, null, 2)}` : '';
        traceLog.textContent += `[${new Date().toLocaleTimeString()}] ${message}${suffix}\n\n`;
    }

    async function initPage() {
        if (!draftId) {
            throw new Error('draftId가 없습니다.');
        }

        trace('reservationConfirm.html 진입');
        const response = await fetch(`/reservation-drafts/${draftId}`);
        if (!response.ok) {
            throw new Error('draft 조회 실패');
        }

        draft = await response.json();
        trace('draft 조회 성공', draft);

        document.getElementById('reservationInfo').innerHTML = `
            <div class="row"><div class="label">공연 제목</div><div class="value">${draft.performanceTitle}</div></div>
            <div class="row"><div class="label">공연 일시</div><div class="value">${draft.performanceDate}</div></div>
            <div class="row"><div class="label">공연 장소</div><div class="value">${draft.performanceVenue}</div></div>
            <div class="row"><div class="label">공연 ID</div><div class="value">${draft.performanceId}</div></div>
            <div class="row"><div class="label">공연 URL</div><div class="value">${draft.performanceUrl}</div></div>
            <div class="row"><div class="label">예매 좌석</div><div class="value">${(draft.selectedSeats || []).join(', ')}</div></div>
            <div class="row"><div class="label">총 가격</div><div class="value">${(draft.totalPrice || 0).toLocaleString()}원</div></div>
        `;
    }

    document.getElementById('confirmBtn').addEventListener('click', async () => {
        try {
            trace('최종 확정 요청 시작', { draftId });
            const response = await fetch(`/reservation-drafts/${draftId}/confirm`, {
                method: 'POST'
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || '최종 예매 확정 실패');
            }

            const result = await response.json();
            trace('최종 확정 성공', result);
            alert(`최종 예매 완료: reservationId=${result.reservationId}`);
        } catch (error) {
            trace('오류 발생', { message: error.message });
            alert(error.message);
        }
    });

    initPage().catch(error => {
        trace('초기화 실패', { message: error.message });
        alert(error.message);
    });
</script>
</body>
</html>
