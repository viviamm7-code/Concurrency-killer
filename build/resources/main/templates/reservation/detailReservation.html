<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예매 상세</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                    radial-gradient(circle at top left, rgba(236, 72, 153, 0.18), transparent 30%),
                    radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 28%),
                    linear-gradient(180deg, #0b1020 0%, #111827 100%);
            color: #f8fafc;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 20px 80px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            text-decoration: none;
        }

        .page-chip {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(236, 72, 153, 0.12);
            color: #f9a8d4;
            font-size: 13px;
            font-weight: 700;
        }

        .detail-card {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 28px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.20);
            backdrop-filter: blur(16px);
        }

        .poster {
            width: 100%;
            height: 100%;
            min-height: 520px;
            object-fit: cover;
            background: #1e293b;
            display: block;
        }

        .content-box {
            padding: 32px;
        }

        .badge {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(244, 114, 182, 0.15);
            color: #f9a8d4;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }

        .info-item {
            background: rgba(15, 23, 42, 0.58);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 18px;
        }

        .info-label {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .info-value {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.5;
        }

        .seat-section {
            margin-top: 10px;
        }

        .seat-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .seat-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .seat-item {
            min-width: 88px;
            text-align: center;
            padding: 12px 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(236,72,153,0.18), rgba(99,102,241,0.18));
            border: 1px solid rgba(255,255,255,0.10);
            color: white;
            font-size: 14px;
            font-weight: 800;
        }

        .cancel-btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 28px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .cancel-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .cancel-btn:disabled,
        .modal-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading-box,
        .error-box {
            padding: 80px 24px;
            text-align: center;
            border-radius: 28px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #cbd5e1;
            font-size: 17px;
        }

        .error-box {
            color: #fecaca;
            white-space: pre-wrap;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.58);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }

        .modal {
            width: 100%;
            max-width: 500px;
            background: #111827;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .policy-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .policy-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #f9a8d4;
        }

        .policy-text {
            color: #d1d5db;
            line-height: 1.8;
            font-size: 14px;
        }

        .modal-question {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-btn.no {
            background: #334155;
            color: white;
        }

        .modal-btn.yes {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
        }

        @media (max-width: 900px) {
            .detail-card {
                grid-template-columns: 1fr;
            }

            .poster {
                min-height: 340px;
            }

            .title {
                font-size: 28px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <a href="/reservation" class="back-btn">← 예매 목록으로</a>
        <div class="page-chip">RESERVATION DETAIL</div>
    </div>

    <div id="content">
        <div class="loading-box">예매 상세 정보를 불러오는 중입니다...</div>
    </div>
</div>

<div class="modal-backdrop" id="cancelModal">
    <div class="modal">
        <div class="modal-title">예매 취소</div>

        <div class="policy-box">
            <div class="policy-title">취소 정책 안내</div>
            <div class="policy-text">
                - 공연 7일 전까지: 전액 환불<br>
                - 공연 3일 전까지: 70% 환불<br>
                - 공연 1일 전까지: 50% 환불<br>
                - 공연 당일 이후: 취소 불가
            </div>
        </div>

        <div class="policy-box">
            <div class="policy-title">환불 정보</div>
            <div class="policy-text" id="refundInfoText">
                환불 정보를 불러오는 중입니다...
            </div>
        </div>

        <div class="modal-question" id="cancelQuestion">예매를 취소하시겠습니까?</div>

        <div class="modal-actions" id="cancelActionButtons">
            <button class="modal-btn no" onclick="closeCancelModal()">아니오</button>
            <button class="modal-btn yes" disabled>예</button>
        </div>
    </div>
</div>

<script>
    const fallbackImage = "https://images.unsplash.com/photo-1503095396549-807759245b35?auto=format&fit=crop&w=1200&q=80";

    function getReservationIdFromPath() {
        const pathParts = window.location.pathname.split("/");
        const value = pathParts[pathParts.length - 1];

        if (!/^\d+$/.test(value)) {
            throw new Error("잘못된 reservationId: " + value);
        }

        return value;
    }

    function formatDateTime(value) {
        if (!value) return "-";

        const date = new Date(value);
        if (isNaN(date)) return value;

        return date.toLocaleString("ko-KR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function formatPrice(price) {
        if (price == null) return "-";
        return Number(price).toLocaleString("ko-KR") + "원";
    }

    function formatStatus(status) {
        const map = {
            RESERVED: "예매 완료",
            CANCELED: "취소"
        };
        return map[status] || status || "-";
    }

    function renderCancelButtons(type) {
        const buttonBox = document.getElementById("cancelActionButtons");

        if (type === "close") {
            buttonBox.innerHTML = `
                <button class="modal-btn no" onclick="closeCancelModal()">닫기</button>
            `;
            return;
        }

        if (type === "confirm") {
            buttonBox.innerHTML = `
                <button class="modal-btn no" onclick="closeCancelModal()">아니오</button>
                <button class="modal-btn yes" onclick="confirmCancel()">예</button>
            `;
            return;
        }

        buttonBox.innerHTML = `
            <button class="modal-btn no" onclick="closeCancelModal()">아니오</button>
            <button class="modal-btn yes" disabled>예</button>
        `;
    }

    function renderDetail(data) {
        const seats = data.seatNumbers || [];
        const imageUrl = data.imageUrl || fallbackImage;
        const isCanceled = data.reservationStatus === "CANCELED";

        return `
            <div class="detail-card">
                <img class="poster" src="${imageUrl}" alt="${data.performanceName}">
                <div class="content-box">
                    <div class="badge">${formatStatus(data.reservationStatus)}</div>
                    <div class="title">${data.performanceName}</div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">예매 번호</div>
                            <div class="info-value">${data.reservationId}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">이름</div>
                            <div class="info-value">${data.reservationName || "-"}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">공연장</div>
                            <div class="info-value">${data.venue}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">공연일시</div>
                            <div class="info-value">${formatDateTime(data.startedAt)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">예매일시</div>
                            <div class="info-value">${formatDateTime(data.reservedAt)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">가격</div>
                            <div class="info-value">${formatPrice(data.price)}</div>
                        </div>
                    </div>

                    <div class="seat-section">
                        <div class="seat-title">예매 좌석</div>
                        <div class="seat-list">
                            ${
            seats.length > 0
                ? seats.map(seat => `<div class="seat-item">${seat}</div>`).join("")
                : `<div class="seat-item">좌석 없음</div>`
        }
                        </div>
                    </div>

                    ${
            isCanceled
                ? `<button class="cancel-btn" disabled>이미 취소된 예매</button>`
                : `<button class="cancel-btn" onclick="openCancelModal()">예매 취소</button>`
        }
                </div>
            </div>
        `;
    }

    function openCancelModal() {
        document.getElementById("cancelModal").style.display = "flex";
        document.getElementById("refundInfoText").innerHTML = "환불 정보를 계산 중입니다...";
        document.getElementById("cancelQuestion").textContent = "예매를 취소하시겠습니까?";
        renderCancelButtons("loading");
        loadCancelPreview();
    }

    function closeCancelModal() {
        document.getElementById("cancelModal").style.display = "none";
    }

    async function loadCancelPreview() {
        const reservationId = getReservationIdFromPath();

        try {
            const response = await fetch(`/api/reservation/${reservationId}/cancel-preview`);

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text);
            }

            const data = await response.json();

            document.getElementById("refundInfoText").innerHTML = `
                총 결제 금액: ${formatPrice(data.totalPrice)}<br>
                환불 비율: ${data.refundRate}%<br>
                환불 금액: ${formatPrice(data.refundAmount)}<br>
                안내: ${data.message || "-"}
            `;

            if (data.reservationStatus === "CANCELED") {
                document.getElementById("cancelQuestion").textContent = "이미 취소된 예매입니다.";
                renderCancelButtons("close");
                return;
            }

            if (data.refundRate === 0) {
                document.getElementById("cancelQuestion").textContent = data.message || "취소할 수 없는 예매입니다.";
                renderCancelButtons("close");
                return;
            }

            renderCancelButtons("confirm");
        } catch (e) {
            console.error(e);
            document.getElementById("refundInfoText").innerHTML = `환불 정보를 불러오지 못했습니다.<br>${e.message}`;
            document.getElementById("cancelQuestion").textContent = "취소 정보를 확인할 수 없습니다.";
            renderCancelButtons("close");
        }
    }

    function goBackAfterCancel() {
        if (window.history.length > 1) {
            history.back();
        } else {
            location.href = "/reservation";
        }
    }

    async function confirmCancel() {
        const reservationId = getReservationIdFromPath();

        try {
            const response = await fetch(`/api/reservation/${reservationId}/cancel`, {
                method: "POST"
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text);
            }

            const result = await response.json();

            document.getElementById("refundInfoText").innerHTML = `
            총 결제 금액: ${formatPrice(result.totalPrice)}<br>
            환불 비율: ${result.refundRate}%<br>
            환불 금액: ${formatPrice(result.refundAmount)}<br>
            안내: ${result.message || "-"}
        `;

            document.getElementById("cancelQuestion").textContent = "환불 처리가 완료되었습니다.";

            document.getElementById("cancelActionButtons").innerHTML = `
            <button class="modal-btn yes" onclick="goBackAfterCancel()">확인</button>
        `;

            sessionStorage.setItem("reservationUpdate", JSON.stringify({
                reservationId: Number(reservationId),
                reservationStatus: "CANCELED",
                seatNumbers: []
            }));

            // 1.2초 뒤 자동 이동
            setTimeout(() => {
                goBackAfterCancel();
            }, 1200);

        } catch (e) {
            console.error(e);
            document.getElementById("refundInfoText").innerHTML = `예매 취소에 실패했습니다.<br>${e.message}`;
            document.getElementById("cancelQuestion").textContent = "다시 시도해주세요.";
            renderCancelButtons("close");
        }
    }

    async function loadReservationDetail() {
        const content = document.getElementById("content");

        try {
            const reservationId = getReservationIdFromPath();
            const response = await fetch(`/api/reservation/${reservationId}/detail`);

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`API 오류: ${response.status} / ${text}`);
            }

            const data = await response.json();
            content.innerHTML = renderDetail(data);
        } catch (e) {
            console.error(e);
            content.innerHTML = `
                <div class="error-box">
                    예매 상세 정보를 불러오지 못했습니다.<br>
                    ${e.message}
                </div>
            `;
        }
    }

    window.onload = loadReservationDetail;
</script>
</body>
</html>
